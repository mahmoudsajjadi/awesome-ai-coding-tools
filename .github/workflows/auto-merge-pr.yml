name: Automated PR Verification & Auto-Merge

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  pull-requests: write
  contents: write
  issues: write

jobs:
  auto-verify-and-merge:
    name: Verify Submission and Auto-Merge
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify Catalog Integrity
        id: verify_catalog
        run: |
          python scripts/verify_catalog.py

      - name: Check Diff Boundaries
        id: check_diff
        run: |
          # Ensure PR only touches README.md or docs/
          git fetch origin main
          CHANGED_FILES=$(git diff --name-only origin/main HEAD)
          echo "Changed files: $CHANGED_FILES"
          for file in $CHANGED_FILES; do
            if [[ "$file" != "README.md" && "$file" != docs/* ]]; then
              echo "PR modifies protected code outside catalog: $file"
              exit 1
            fi
          done
          echo "safe=true" >> $GITHUB_OUTPUT

      - name: Auto-Merge Qualifying PR
        if: steps.verify_catalog.conclusion == 'success' && steps.check_diff.conclusion == 'success'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const pr = context.payload.pull_request;
            console.log(`Auto-merging clean PR #${pr.number} by ${pr.user.login}...`);

            try {
              await github.rest.pulls.merge({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: pr.number,
                merge_method: 'squash'
              });

              // Post celebratory welcome comment with badge
              const badgeSnippet = `### 🎉 Congratulations @${pr.user.login}!

Your contribution has passed automated validation and has been automatically merged into **Awesome AI Coding Tools**.

#### 🛡️ Embed Your Featured Badge:
Add this badge to your repository's README to showcase your tool in this curated catalog:

\`\`\`markdown
[![Featured in Awesome AI Coding Tools](https://raw.githubusercontent.com/mahmoudsajjadi/awesome-ai-coding-tools/main/assets/badge-featured.svg)](https://github.com/mahmoudsajjadi/awesome-ai-coding-tools)
\`\`\`

⭐ *If you haven't yet, starring the repository helps increase visibility for all featured open-source tools!*`;

              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                body: badgeSnippet
              });

              console.log('Successfully merged PR and posted badge comment.');
            } catch (err) {
              console.error('Error during auto-merge:', err);
            }
