name: Safe Auto-Merge for Single-Entry Submissions

# SECURITY: This workflow never checks out or executes code from the PR.
# It only inspects the diff via the GitHub API, so a malicious fork cannot
# run code with this repository's write token.

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  pull-requests: write
  contents: write

jobs:
  safe-auto-merge:
    runs-on: ubuntu-latest
    steps:
      - name: Validate diff and merge
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const { owner, repo } = context.repo;
            const files = await github.paginate(github.rest.pulls.listFiles, { owner, repo, pull_number: pr.number });

            const reject = async (reason) => {
              core.info(`Not auto-merging: ${reason}`);
              await github.rest.issues.createComment({ owner, repo, issue_number: pr.number,
                body: `Thanks for the submission! This PR needs manual maintainer review (${reason}).` });
            };

            if (files.length !== 1 || files[0].filename !== 'README.md') return reject('must change README.md only');
            const f = files[0];
            if (f.additions !== 1 || f.deletions !== 0) return reject('must add exactly one line');

            const added = (f.patch || '').split('\n').filter(l => l.startsWith('+') && !l.startsWith('+++')).map(l => l.slice(1));
            const line = added[0] || '';
            const entry = /^- \[[^\]]{1,80}\]\(https:\/\/[^\s)]+\) [—-] [A-Z].{20,400}\.$/;
            if (!entry.test(line)) return reject('entry must match `- [Name](https://url) — Description.`');
            if (/utm_|ref=|affiliate/i.test(line)) return reject('tracking/affiliate parameters are not allowed');

            const url = line.match(/\]\((https:\/\/[^\s)]+)\)/)[1];
            const readme = await github.rest.repos.getContent({ owner, repo, path: 'README.md', ref: 'main' });
            const current = Buffer.from(readme.data.content, 'base64').toString('utf8');
            if (current.includes(url)) return reject('this URL is already listed');

            await github.rest.pulls.merge({ owner, repo, pull_number: pr.number, merge_method: 'squash' });
            await github.rest.issues.createComment({ owner, repo, issue_number: pr.number,
              body: `Merged automatically. Thanks, @${pr.user.login}!\n\nOptional badge for your README:\n\n\`\`\`markdown\n[![Featured in Awesome AI Coding Tools](https://raw.githubusercontent.com/mahmoudsajjadi/awesome-ai-coding-tools/main/assets/badge-featured.svg)](https://github.com/mahmoudsajjadi/awesome-ai-coding-tools)\n\`\`\`` });
