name: Weekly Discovery & Ecosystem Digest

on:
  schedule:
    - cron: '0 6 * * 1' # Every Monday at 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  discover-and-digest:
    name: Discover Trending Tools & Open Review Issue
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Discover Trending AI Coding Tools & MCP Servers
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/discover_new.py

      - name: Generate Current Date String
        id: date
        run: echo "date=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT

      - name: Open Human Review Issue for Discovered Candidates
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const path = './docs/DISCOVERY_ISSUE_BODY.md';
            if (!fs.existsSync(path)) {
              core.setFailed('DISCOVERY_ISSUE_BODY.md not found');
              return;
            }
            const body = fs.readFileSync(path, 'utf8');
            const dateStr = '${{ steps.date.outputs.date }}';
            const title = `Ecosystem Discovery: Candidate Tools for Human Review (${dateStr})`;

            // Check if an open issue with the same title already exists
            const existingIssues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              creator: 'github-actions[bot]'
            });

            const duplicate = existingIssues.data.find(issue => issue.title === title);
            if (duplicate) {
              core.info(`Issue already exists: #${duplicate.number}`);
            } else {
              const res = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: title,
                body: body,
                labels: ['ecosystem-discovery', 'needs-review']
              });
              core.info(`Created discovery issue: #${res.data.number}`);
            }
