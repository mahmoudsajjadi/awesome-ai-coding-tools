name: Nightly Catalog Metadata & Health Refresher

on:
  schedule:
    - cron: '0 3 * * *' # Every night at 03:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh-metadata:
    name: Refresh Stars, Releases & Health
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify Catalog & Sync tools.json
        run: |
          python scripts/verify_catalog.py

      - name: Fetch Live Stars, Licenses & Health
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/refresh_metadata.py

      - name: Create or Update Pull Request
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore(catalog): automated nightly live metadata & health sync"
          title: "chore(catalog): automated nightly live metadata & health sync"
          body: |
            Automated nightly sync of catalog metadata and health metrics.
            
            - Refreshes GitHub stars, fork count, open issues, and latest push timestamp.
            - Updates repository license and archived status flags.
            - Checks HTTP reachability across all listed tools and documentation endpoints.
            - Syncs `docs/tools.json` and `docs/catalog_metadata.json`.
            
            *Triggered automatically by `.github/workflows/nightly-metadata.yml`.*
          branch: automated-metadata-sync
          delete-branch: true
          labels: |
            automated
            catalog-sync
