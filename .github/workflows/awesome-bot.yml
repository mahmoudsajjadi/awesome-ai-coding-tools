name: Awesome Submission Checklist & Bot

on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited]
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1' # Every Monday at 06:00 UTC
  workflow_dispatch:

permissions:
  pull-requests: write
  contents: read
  issues: write

jobs:
  awesome-lint-and-links:
    name: Lint & Link Verification Bot
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Markdown Lint Validation
        run: |
          npx markdownlint-cli "README.md" --disable MD013 MD024 MD033 MD041 || true

      - name: Continuous Link Health Check
        uses: gaurav-nelson/github-action-markdown-link-check@v1
        continue-on-error: true
        with:
          use-quiet-mode: 'yes'
          check-modified-files-only: ${{ github.event_name == 'pull_request_target' && 'yes' || 'no' }}
          config-file: '.github/mlc_config.json'

  pr-checklist-bot:
    name: Submission Quality Bot
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request_target' && github.event.action == 'opened'
    steps:
      - name: Review & Comment Checklist
        uses: actions/github-script@v7
        with:
          script: |
            const comment = [
              '### 🌟 Welcome to Awesome AI Coding Tools!',
              '',
              'Thank you for proposing an addition to this curated 2026 developer stack.',
              '',
              '### 📋 Automated Submission Quality Checklist:',
              '- [ ] **Formatting:** Follows `- [ToolName](https://url) - Objective 1-2 sentence description.`',
              '- [ ] **Punctuation:** Begins with capital letter, ends with a terminating period (`.`).',
              '- [ ] **Alphabetical Ordering:** Placed in alphabetical order within its subcategory.',
              '- [ ] **Categorization:** Mapped to the appropriate progressive tier (Beginner IDE / CLI Pair Programmer / Local Weights / SWE-bench).',
              '- [ ] **Zero Promotional Hype:** Factual descriptions with concrete capabilities (e.g. context window, supported runtimes, licenses).',
              '- [ ] **No Dead Links:** All URLs must serve valid 200 responses over HTTPS.',
              '',
              '⭐ *If you find this curated ecosystem valuable, please consider giving the repository a star to help other developers discover your tool!*',
              '',
              '*Our continuous integration link-check and markdown validation suite will verify this PR automatically. A maintainer will review and merge qualifying entries within 24 hours!*'
            ].join('\n');

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
